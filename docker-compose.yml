services:
  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - vlowgen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Frontend service (Astro)
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://backend:3001}
      - PUBLIC_WAN2_API_KEY=${PUBLIC_WAN2_API_KEY}
      - PUBLIC_OPENROUTER_API_KEY=${PUBLIC_OPENROUTER_API_KEY}
      - PUBLIC_COMPOSIO_API_KEY=${PUBLIC_COMPOSIO_API_KEY}
      - PUBLIC_FINGERPRINT_API_KEY=${PUBLIC_FINGERPRINT_API_KEY}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
      - TWITTER_AUTH_CONFIG_ID=${TWITTER_AUTH_CONFIG_ID}
      - FACEBOOK_AUTH_CONFIG_ID=${FACEBOOK_AUTH_CONFIG_ID}
      - INSTAGRAM_AUTH_CONFIG_ID=${INSTAGRAM_AUTH_CONFIG_ID}
      - TIKTOK_AUTH_CONFIG_ID=${TIKTOK_AUTH_CONFIG_ID}
      - YOUTUBE_AUTH_CONFIG_ID=${YOUTUBE_AUTH_CONFIG_ID}
    depends_on:
      - backend
      - minio
    restart: unless-stopped
    networks:
      - vlowgen-network

  # Backend service
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - WAN2_API_URL=${WAN2_API_URL}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
      - COMPOSIO_API_URL=${COMPOSIO_API_URL}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=vlowgen-images
    depends_on:
      - minio
    restart: unless-stopped
    networks:
      - vlowgen-network

networks:
  vlowgen-network:
    driver: bridge

volumes:
  minio-data: