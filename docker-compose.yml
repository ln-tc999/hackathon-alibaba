services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: vlowgen-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - vlowgen-network
    security_opt:
      - no-new-privileges:true

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: vlowgen-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - vlowgen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true

  # Frontend service (Astro)
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        - PUBLIC_API_URL=${PUBLIC_API_URL:-}
        - PUBLIC_WAN2_API_KEY=${PUBLIC_WAN2_API_KEY}
        - PUBLIC_OPENROUTER_API_KEY=${PUBLIC_OPENROUTER_API_KEY}
        - PUBLIC_COMPOSIO_API_KEY=${PUBLIC_COMPOSIO_API_KEY}
        - PUBLIC_FINGERPRINT_API_KEY=${PUBLIC_FINGERPRINT_API_KEY}
    container_name: vlowgen-frontend
    expose:
      - "4321"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - HOST=0.0.0.0
      - PORT=4321
      - PUBLIC_API_URL=${PUBLIC_API_URL:-}
      - PUBLIC_WAN2_API_KEY=${PUBLIC_WAN2_API_KEY}
      - PUBLIC_OPENROUTER_API_KEY=${PUBLIC_OPENROUTER_API_KEY}
      - PUBLIC_COMPOSIO_API_KEY=${PUBLIC_COMPOSIO_API_KEY}
      - PUBLIC_FINGERPRINT_API_KEY=${PUBLIC_FINGERPRINT_API_KEY}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
      - TWITTER_AUTH_CONFIG_ID=${TWITTER_AUTH_CONFIG_ID}
      - FACEBOOK_AUTH_CONFIG_ID=${FACEBOOK_AUTH_CONFIG_ID}
      - INSTAGRAM_AUTH_CONFIG_ID=${INSTAGRAM_AUTH_CONFIG_ID}
      - TIKTOK_AUTH_CONFIG_ID=${TIKTOK_AUTH_CONFIG_ID}
      - YOUTUBE_AUTH_CONFIG_ID=${YOUTUBE_AUTH_CONFIG_ID}
    depends_on:
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vlowgen-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4321/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Backend service with SSL support
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: vlowgen-backend
    ports:
      - "3001:3001"
    dns:
      - 100.100.2.136
      - 100.100.2.138
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro  # Mount SSL certificates
    cap_add:
      - NET_ADMIN  # Allow network configuration
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3001
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - USE_SSL=${USE_SSL:-false}
      - SSL_CERT_PATH=${SSL_CERT_PATH}
      - SSL_KEY_PATH=${SSL_KEY_PATH}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - WAN2_API_URL=${WAN2_API_URL}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
      - COMPOSIO_API_URL=${COMPOSIO_API_URL}
      # Social Media Auth Config IDs (for OAuth)
      - INSTAGRAM_AUTH_CONFIG_ID=${INSTAGRAM_AUTH_CONFIG_ID}
      - TWITTER_AUTH_CONFIG_ID=${TWITTER_AUTH_CONFIG_ID}
      - FACEBOOK_AUTH_CONFIG_ID=${FACEBOOK_AUTH_CONFIG_ID}
      - TIKTOK_AUTH_CONFIG_ID=${TIKTOK_AUTH_CONFIG_ID}
      - YOUTUBE_AUTH_CONFIG_ID=${YOUTUBE_AUTH_CONFIG_ID}
      # Twitter OAuth 1.0a Direct API (optional - for enhanced media uploads)
      - TWITTER_CONSUMER_KEY=${TWITTER_CONSUMER_KEY}
      - TWITTER_CONSUMER_SECRET=${TWITTER_CONSUMER_SECRET}
      - TWITTER_ACCESS_TOKEN=${TWITTER_ACCESS_TOKEN}
      - TWITTER_ACCESS_TOKEN_SECRET=${TWITTER_ACCESS_TOKEN_SECRET}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET_NAME=vlowgen-images
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:4321}
      - REQUIRE_API_KEY=${REQUIRE_API_KEY:-false}
      - API_KEY=${API_KEY}
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vlowgen-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

networks:
  vlowgen-network:
    driver: bridge

volumes:
  minio-data:
    driver: local
